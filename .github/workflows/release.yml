name: Build and Release C# App

on:
  push:
    branches: 
      - master

jobs:
  build-and-release:
    runs-on: windows-latest # Windows-Runner, ideal für native .exe-Erstellung
    
    permissions:
      contents: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore

      - name: Projekt als Release veröffentlichen (.exe)
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: GitHub Release erstellen und .exe hochladen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: ./publish/bosch-image-creator.exe # Hier wird direkt die .exe aus dem publish-Ordner genommen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
