name: Build and Release C# App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest # Windows-Runner, ideal für native .exe-Erstellung

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore

      - name: Projekt als Release veröffentlichen (.exe)
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Dateien in ZIP-Archiv verpacken
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./bosch-image-creator-x64.zip

      - name: GitHub Release erstellen und Asset hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: ./bosch-image-creator-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
