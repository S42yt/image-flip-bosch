name: Build and Release C# App

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Lokale Proxy-Konfiguration entfernen
        run: Remove-Item nuget.config -ErrorAction SilentlyContinue

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore image-flip-bosch.sln

      - name: Backend bauen
        run: dotnet build Backend/Backend.csproj -c Release --no-restore

      - name: CLI-Projekt als Release veröffentlichen (.exe)
        run: dotnet publish CLI/CLI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: GitHub Release erstellen und .exe hochladen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: ./publish/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
